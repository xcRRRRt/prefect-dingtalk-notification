name: Publish package to PyPI

on:
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Check source
        run: uv run ruff check src tests

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(uv version --short)"
          release_version="${RELEASE_TAG#v}"
          if [ "$package_version" != "$release_version" ]; then
            echo "pyproject.toml version ($package_version) does not match release tag ($RELEASE_TAG)" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build --clear

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-distributions
          path: dist/

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/prefect-dingtalk-notification
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Download distributions artifact
        uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/

      - name: Publish to PyPI
        run: uv publish

