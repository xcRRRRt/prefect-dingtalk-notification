name: DingTalk integration

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Run integration tests
        env:
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_KEYWORD: ${{ vars.DINGTALK_KEYWORD || 'Prefect' }}
        run: uv run pytest --run-integration --junitxml=test-results/dingtalk.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dingtalk-integration-report
          path: test-results/dingtalk.xml
