services:
  prefect:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: prefect-dingtalk-notification-test:latest
    ports:
      - "127.0.0.1:14200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://127.0.0.1:14200/api
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
